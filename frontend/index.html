<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores Amarillas YO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>


<body>


    <section id="welcome" class="screen welcome">
        <div class="star star-1">✦</div>
        <div class="star star-2">✦</div>
        <div class="star star-3">✦</div>
        <div class="star star-4">✦</div>

        <img src="assets/rama-izq.png" alt="" class="corner-branch left">
        <img src="assets/rama-der.png" alt="" class="corner-branch right">

        <h1 class="welcome-title">¿Lista para algo espectacular o maravilloso?</h1>

        <button class="flower-button" onclick="openTree()" aria-label="Abrir flores">
            <img src="assets/margarita.jpg" alt="Margarita verdadera" class="real-flower">
        </button>

        <div class="instruction">
            Toca la flor
            <div class="hand">☝︎</div>
        </div>
    </section>



    <section id="treeScreen" class="screen tree-screen hidden">

        <audio id="bgMusic" loop>
            <source src="assets/girasoles.mp3" type="audio/mpeg">
        </audio>

        <button class="back" onclick="goBack()" style="z-index: 100;">
            ←
        </button>

        <button id="musicToggle" class="music-btn" onclick="toggleMusic()" style="z-index: 100;"
            title="Reproducir/Pausar música">
            🌻
        </button>

        <div class="tree-container"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
            <canvas id="canvas"></canvas>

            <!-- AQUI COLOCAN SU MENSAJE PS :v -->
            <div id="finalMessage" class="final-message">
                Para la dueña de mi corazón, que sin saberlo ilumina mis días como el sol a estos girasoles y hace mi
                mundo un poquito más bonito. 🌻❤️
            </div>
        </div>

    </section>


    <script src="js/main.js"></script>

</body>

</html>
